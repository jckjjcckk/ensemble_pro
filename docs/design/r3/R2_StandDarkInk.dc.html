<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio R2 · Stand · dark, inverted page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Music&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #141311; color: #EDE7D8; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 8px; background: #1E1C18; border-bottom: 1px solid #3A372F">
    <div style="display: flex; align-items: center; gap: 6px">
      <button aria-label="Back to the shelf" style="height: 44px; padding: 0 12px 0 6px; border: 0; border-radius: 10px; background: transparent; color: #EDE7D8; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 2px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Shelf
      </button>
      <div style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-family: 'EB Garamond', serif; font-size: 17px; font-weight: 500">String Quartet No. 4 in C minor, Op. 18 — Violin I</span>
        <span style="font-size: 11px; color: #A39C8C">Beethoven · bars 49–80 of 236</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 2px; background: #2C2A25; border-radius: 9px; padding: 2px">
      <button aria-current="true" style="height: 34px; padding: 0 18px; border: 0; border-radius: 7px; background: #3F3B33; color: #EDE7D8; font: 500 14px Inter, sans-serif">Read</button>
      <button style="height: 34px; padding: 0 18px; border: 0; border-radius: 7px; background: transparent; color: #A39C8C; font: 500 14px Inter, sans-serif">Practise</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; align-items: center; gap: 2px; border: 1px solid #3F3B33; border-radius: 9px; padding: 2px">
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: #A39C8C; font: 500 13px Inter, sans-serif">Mine</button>
        <button aria-current="true" style="height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: #EDE7D8; color: #1E1C18; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 7px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #5B86C8"></span>Quartet</button>
      </div>
      <div style="display: flex; align-items: center">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #5B86C8; color: #FFFFFF; font: 600 11px Inter, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #1E1C18">AK</span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #C8905B; color: #FFFFFF; font: 600 11px Inter, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #1E1C18; margin-left: -8px">JL</span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #7A9A6B; color: #FFFFFF; font: 600 11px Inter, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #1E1C18; margin-left: -8px">MR</span>
      </div>
    </div>
  </div>

  <div style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center; gap: 24px">
    <sc-for list="{{pages}}" as="page" hint-placeholder-count="2">
      <div style="position: relative; width: 495px; height: 700px; box-sizing: border-box; padding: 30px 34px; background: #26241F; border: 1px solid #3A372F; display: flex; flex-direction: column; justify-content: space-between">
        <sc-for list="{{page.systems}}" as="sys" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 14px; border-left: 2px solid #EDE7D8">
            <sc-for list="{{sys.staves}}" as="st" hint-placeholder-count="4">
              <div style="display: flex; height: 24px">
                <span style="width: 26px; position: relative; flex: none">
                  <span aria-hidden="true" style="position: absolute; left: 3px; top: {{st.ct}}px; font-family: 'Noto Music', serif; font-size: {{st.cs}}px; line-height: 1; color: #EDE7D8">{{st.clef}}</span>
                </span>
                <div style="flex: 1; display: flex; position: relative; background: repeating-linear-gradient(to bottom, #D6D0C0 0 1px, transparent 1px 6px); height: 25px">
                  <sc-for list="{{st.bars}}" as="bar" hint-placeholder-count="4">
                    <div style="flex: 1; position: relative; border-right: 1px solid #D6D0C0">
                      <sc-if value="{{bar.hl}}" hint-placeholder-val="{{false}}">
                        <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -8px; bottom: -8px; background: rgba(224,176,60,0.30)"></span>
                      </sc-if>
                      <sc-if value="{{bar.first}}" hint-placeholder-val="{{false}}">
                        <span style="position: absolute; left: 2px; top: -16px; font: 500 9px Inter, sans-serif; color: #A39C8C">{{bar.num}}</span>
                      </sc-if>
                      <sc-for list="{{bar.notes}}" as="n" hint-placeholder-count="3">
                        <span aria-hidden="true" style="position: absolute; left: {{n.x}}%; top: {{n.y}}px; width: 7px; height: 5px; border-radius: 50%; background: #EDE7D8; transform: rotate(-22deg)"></span>
                        <span aria-hidden="true" style="position: absolute; left: calc({{n.x}}% + 6px); top: {{n.sy}}px; width: 1px; height: 16px; background: #EDE7D8"></span>
                      </sc-for>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>
        <span style="position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-family: 'EB Garamond', serif; font-size: 11px; color: #A39C8C">{{page.label}}</span>
      </div>
    </sc-for>

    <div role="menu" aria-label="Bar 58" style="position: absolute; left: 356px; top: 396px; width: 200px; box-sizing: border-box; padding: 6px; background: #EDE7D8; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,0.5); display: flex; flex-direction: column">
      <span aria-hidden="true" style="position: absolute; left: -6px; top: 22px; width: 13px; height: 13px; background: #EDE7D8; transform: rotate(45deg)"></span>
      <span style="padding: 6px 12px 8px 12px; font-family: 'EB Garamond', serif; font-size: 13px; color: #6B665C; border-bottom: 1px solid #D9D3C5">Bar 58</span>
      <button role="menuitem" style="height: 46px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #1C1A16; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16l9-9 3 3-9 9H6z"/></svg>Highlight
      </button>
      <button role="menuitem" style="height: 46px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #1C1A16; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H9l-4 4z"/></svg>Note
      </button>
      <button role="menuitem" style="height: 46px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #1C1A16; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c3-6 6 2 9-4s4-5 7-9"/></svg>Scribble
      </button>
      <button role="menuitem" style="height: 46px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #1C1A16; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4l3 3-3 3M4 7h16M7 20l-3-3 3-3M20 17H4"/></svg>Loop from here
      </button>
    </div>

    <div style="position: absolute; left: 318px; top: 184px; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; background: #1E1C18; border: 1px solid #5B86C8; border-radius: 10px; font-size: 12px; color: #EDE7D8">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #5B86C8; color: #FFFFFF; font: 600 9px Inter, sans-serif; display: flex; align-items: center; justify-content: center">AK</span>
      <span>Breathe before the <i>sf</i> — bar 54</span>
    </div>

    <div style="position: absolute; left: 24px; top: 400px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #7A9A6B; color: #FFFFFF; font: 600 12px Inter, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #141311">MR</span>
      <span style="font-size: 10px; color: #A39C8C">bar 58</span>
    </div>
    <div style="position: absolute; right: 24px; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #C8905B; color: #FFFFFF; font: 600 12px Inter, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #141311">JL</span>
      <span style="font-size: 10px; color: #A39C8C">bar 71</span>
    </div>

    <button style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); height: 40px; padding: 0 16px 0 8px; border: 1px solid #3F3B33; border-radius: 20px; background: #1E1C18; color: #EDE7D8; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 8px">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #5B86C8; color: #FFFFFF; font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">AK</span>
      Following Anna's page turns
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 11;
    const rnd = () => { s = (s * 48271) % 2147483647; return s / 2147483647; };
    const clefs = [
      { clef: '𝄞', cs: 34, ct: -8 },
      { clef: '𝄞', cs: 34, ct: -8 },
      { clef: '𝄡', cs: 26, ct: -1 },
      { clef: '𝄢', cs: 26, ct: -3 }
    ];
    let bar = 49;
    const pages = [];
    for (let p = 0; p < 2; p++) {
      const systems = [];
      const firstBar = bar;
      for (let si = 0; si < 4; si++) {
        const staves = clefs.map((c, st) => {
          const bars = [];
          for (let bi = 0; bi < 4; bi++) {
            const num = bar + bi;
            const n = 2 + Math.floor(rnd() * 4);
            const notes = [];
            for (let k = 0; k < n; k++) {
              const x = 8 + Math.round((k + 0.5) * (82 / n));
              const y = Math.round(rnd() * 8) * 3 - 6;
              notes.push({ x, y, sy: y - 14 });
            }
            bars.push({ num, first: st === 0, hl: num === 58, notes });
          }
          return Object.assign({ bars }, c);
        });
        bar += 4;
        systems.push({ staves });
      }
      pages.push({ systems, label: 'bars ' + firstBar + '–' + (bar - 1) });
    }
    return { pages };
  }
}
</script>
</body>
</html>
