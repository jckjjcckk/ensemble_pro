<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio R3 · Shelf · Mine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Music&display=swap">
<style>
body{margin:0}
@keyframes folio-spin{to{transform:rotate(360deg)}}
.spin{animation:folio-spin 1.4s linear infinite}
</style>
</helmet>
<div style="width: 834px; height: 1194px; box-sizing: border-box; background: #F3EFE6; color: #1C1A16; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 56px 40px 18px 40px">
    <h1 style="margin: 0; font-family: 'EB Garamond', serif; font-weight: 500; font-size: 46px; line-height: 1">My Library</h1>
    <div style="display: flex; gap: 10px; align-items: center">
      <button aria-label="Import a PDF or MusicXML file" style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #CFC8B8; background: #FBF9F4; font: 500 16px Inter, sans-serif; color: #1C1A16; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
        Import
      </button>
      <button aria-label="Scan a paper score with the camera" style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #CFC8B8; background: #FBF9F4; font: 500 16px Inter, sans-serif; color: #1C1A16; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>
        Scan
      </button>
      <button aria-label="Account and appearance" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #CFC8B8; background: #FBF9F4; font: 600 15px 'EB Garamond', serif; color: #1C1A16; margin-left: 4px">K</button>
    </div>
  </div>
  <div style="padding: 0 40px 12px 40px; display: flex; align-items: center; gap: 14px">
    <div role="tablist" aria-label="Which shelf" style="display: flex; align-items: center; gap: 2px; background: #E2DCCD; border-radius: 9px; padding: 2px">
      <button role="tab" aria-selected="true" style="height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: #FBF9F4; color: #1C1A16; font: 500 13px Inter, sans-serif; box-shadow: 0 1px 1px rgba(28,26,22,0.12)">My Library</button>
      <button role="tab" aria-selected="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #6B665C; font: 500 13px Inter, sans-serif">Groups</button>
    </div>
    <span style="font-size: 14px; color: #6B665C">9 books · 2 being read · 1 needs you</span>
  </div>

  <div style="flex: 1; padding: 4px 40px 0 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-content: start">
    <sc-for list="{{books}}" as="b" hint-placeholder-count="9">
      <div style="position: relative; background: #FBF9F4; border: 1px solid #E2DCCD; border-radius: 6px; height: 290px; box-sizing: border-box; padding: 20px 18px 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 0 #E2DCCD">
        <div style="font-family: 'EB Garamond', serif; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B665C">{{b.composer}}</div>
        <div style="font-family: 'EB Garamond', serif; font-size: 22px; line-height: 1.12; font-weight: 500; color: #1C1A16">{{b.title}}</div>
        <div style="flex: 1"></div>
        <div style="position: relative; width: 168px; height: 56px">
          <div style="position: absolute; left: 0; right: 0; top: 12px; height: 33px; background: repeating-linear-gradient(to bottom, #1C1A16 0 1px, transparent 1px 8px)"></div>
          <span aria-hidden="true" style="position: absolute; left: 2px; top: -6px; font-family: 'Noto Music', serif; font-size: 48px; line-height: 1; color: #1C1A16">𝄞</span>
          <sc-for list="{{b.acc}}" as="a" hint-placeholder-count="2">
            <span aria-hidden="true" style="position: absolute; left: {{a.x}}px; top: {{a.y}}px; font-family: 'Noto Music', serif; font-size: 20px; line-height: 20px; color: #1C1A16">{{a.g}}</span>
          </sc-for>
          <span aria-hidden="true" style="position: absolute; left: {{b.tx}}px; top: 12px; font: 600 18px/16px 'EB Garamond', serif; color: #1C1A16">{{b.tn}}</span>
          <span aria-hidden="true" style="position: absolute; left: {{b.tx}}px; top: 28px; font: 600 18px/16px 'EB Garamond', serif; color: #1C1A16">{{b.td}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #6B665C; margin-top: 4px">
          <span>{{b.bars}} bars</span>
          <span style="display: flex; align-items: center; gap: 6px">
            <sc-if value="{{b.shared}}" hint-placeholder-val="{{false}}"><span aria-label="Shared with a group" style="width: 8px; height: 8px; border-radius: 50%; background: #5B86C8"></span></sc-if>
            <span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid #CFC8B8; border-radius: 4px; color: #4D4840">{{b.tag}}</span>
          </span>
        </div>
        <sc-if value="{{b.failed}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 12px; color: #B5392E; line-height: 1.3">Page 3 could not be read — rescan it</div>
        </sc-if>
        <sc-if value="{{b.busy}}" hint-placeholder-val="{{false}}">
          <span aria-label="Being read" class="spin" style="position: absolute; top: 14px; right: 14px; width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid #DDD7C8; border-top-color: #1C1A16; box-sizing: border-box"></span>
        </sc-if>
        <sc-if value="{{b.ask}}" hint-placeholder-val="{{false}}">
          <span aria-label="Needs your confirmation" style="position: absolute; top: 14px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: #D8A62B"></span>
        </sc-if>
        <sc-if value="{{b.failed}}" hint-placeholder-val="{{false}}">
          <span aria-label="Import failed" style="position: absolute; top: 14px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: #B5392E"></span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="height: 86px; display: flex; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid #E2DCCD; background: #F3EFE6">
    <button aria-current="page" style="height: 56px; padding: 0 28px; border-radius: 28px; border: 0; background: #1C1A16; color: #F3EFE6; font: 500 16px Inter, sans-serif; display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16M8 4v16M14 4v16"/></svg>
      Shelf
    </button>
    <button style="height: 56px; padding: 0 28px; border-radius: 28px; border: 0; background: transparent; color: #1C1A16; font: 500 16px Inter, sans-serif; display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>
      Stand
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    const SH = ['F','C','G','D','A','E','B'], FL = ['B','E','A','D','G','C','F'];
    const SY = {F:0, C:12, G:-4, D:8, A:20, E:4, B:16};
    const FY = {B:16, E:4, A:20, D:8, G:24, C:12, F:28};
    const sig = (n) => {
      const acc = []; const k = Math.abs(n);
      for (let i = 0; i < k; i++) {
        const L = (n > 0 ? SH : FL)[i];
        acc.push({ g: n > 0 ? '♯' : '♭', x: 42 + i * 9, y: 12 + (n > 0 ? SY[L] : FY[L]) - 10 });
      }
      return { acc, tx: 42 + k * 9 + 10 };
    };
    const raw = [
      { composer: 'Schubert',  title: 'Piano Quintet in A, D.667 "Trout"',       k: 3,  tn: '4', td: '4', bars: '1,228', tag: 'Digital' },
      { composer: 'Beethoven', title: 'String Quartet No. 4 in C minor, Op. 18',  k: -3, tn: '4', td: '4', bars: '236',   tag: 'PDF', busy: true, shared: true },
      { composer: 'Brahms',    title: 'Violin Sonata No. 1 in G, Op. 78',        k: 1,  tn: '6', td: '4', bars: '325',   tag: 'PDF' },
      { composer: 'Fauré',     title: 'Requiem, Op. 48 — Pie Jesu',              k: -2, tn: '4', td: '4', bars: '46',    tag: 'Digital', shared: true },
      { composer: 'Mozart',    title: 'Clarinet Quintet in A, K.581',            k: 3,  tn: '4', td: '4', bars: '—',     tag: 'PDF', ask: true },
      { composer: 'Dvořák',    title: 'String Quartet No. 12 "American", Op. 96', k: -1, tn: '2', td: '4', bars: '183',   tag: 'Digital', shared: true },
      { composer: 'Pärt',      title: 'Spiegel im Spiegel',                      k: -1, tn: '6', td: '4', bars: '102',   tag: 'Digital' },
      { composer: 'Byrd',      title: 'Ave verum corpus',                        k: -1, tn: '2', td: '2', bars: '—',     tag: 'PDF', failed: true },
      { composer: 'Haydn',     title: 'String Quartet "Emperor", Op. 76 No. 3',  k: 0,  tn: '4', td: '4', bars: '262',   tag: 'PDF', shared: true }
    ];
    const books = raw.map(b => Object.assign({}, b, sig(b.k)));
    return { books };
  }
}
</script>
</body>
</html>
