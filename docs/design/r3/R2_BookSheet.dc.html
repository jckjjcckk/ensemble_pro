<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio R2 · Book sheet over the shelf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Music&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 834px; height: 1194px; box-sizing: border-box; background: #F3EFE6; color: #1C1A16; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0.5">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 56px 40px 14px 40px">
      <span style="font-family: 'EB Garamond', serif; font-weight: 500; font-size: 46px; line-height: 1">Shelf</span>
      <div style="display: flex; gap: 10px"><span style="width: 96px; height: 48px; border-radius: 12px; border: 1px solid #CFC8B8"></span><span style="width: 86px; height: 48px; border-radius: 12px; border: 1px solid #CFC8B8"></span><span style="width: 104px; height: 48px; border-radius: 12px; background: #1C1A16"></span><span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #CFC8B8"></span></div>
    </div>
    <div style="padding: 28px 40px; display: flex; gap: 18px"><span style="width: 232px; height: 246px; border-radius: 6px; background: #FBF9F4; border: 1px solid #E2DCCD"></span><span style="width: 232px; height: 246px; border-radius: 6px; background: #FBF9F4; border: 2px solid #1C1A16"></span><span style="width: 232px; height: 246px; border-radius: 6px; background: #FBF9F4; border: 1px solid #E2DCCD"></span></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28,26,22,0.28)"></div>

  <div role="dialog" aria-label="String Quartet No. 4" style="position: absolute; left: 0; right: 0; bottom: 0; height: 790px; box-sizing: border-box; background: #FBF9F4; border-radius: 22px 22px 0 0; box-shadow: 0 -16px 48px rgba(28,26,22,0.30); padding: 14px 44px 32px 44px; display: flex; flex-direction: column; gap: 22px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #CFC8B8"></span>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px; flex: 1">
        <div style="font-family: 'EB Garamond', serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B665C">Beethoven</div>
        <h2 style="margin: 0; font-family: 'EB Garamond', serif; font-weight: 500; font-size: 36px; line-height: 1.1">String Quartet No. 4 in C minor, Op. 18 No. 4</h2>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 14px; color: #6B665C">
          <span>236 bars · 4 parts · 14 pages</span>
          <span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid #CFC8B8; border-radius: 4px; color: #4D4840">PDF</span>
          <button aria-label="Dates and provenance" style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid #CFC8B8; background: transparent; font: 500 14px 'EB Garamond', serif; color: #6B665C">i</button>
        </div>
      </div>
      <div style="position: relative; width: 262px; height: 84px; flex: none; margin-top: 10px">
        <div style="position: absolute; left: 0; right: 0; top: 18px; height: 49px; background: repeating-linear-gradient(to bottom, #1C1A16 0 1px, transparent 1px 12px)"></div>
        <span aria-hidden="true" style="position: absolute; left: 3px; top: -9px; font-family: 'Noto Music', serif; font-size: 72px; line-height: 1; color: #1C1A16">𝄞</span>
        <sc-for list="{{acc}}" as="a" hint-placeholder-count="3">
          <span aria-hidden="true" style="position: absolute; left: {{a.x}}px; top: {{a.y}}px; font-family: 'Noto Music', serif; font-size: 30px; line-height: 30px; color: #1C1A16">♭</span>
        </sc-for>
        <span aria-hidden="true" style="position: absolute; left: 118px; top: 18px; font: 600 27px/24px 'EB Garamond', serif; color: #1C1A16">4</span>
        <span aria-hidden="true" style="position: absolute; left: 118px; top: 42px; font: 600 27px/24px 'EB Garamond', serif; color: #1C1A16">4</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="grid-column: span 2; height: 72px; padding: 0 22px; border: 0; border-radius: 14px; background: #1C1A16; color: #F3EFE6; display: flex; align-items: center; justify-content: space-between; text-align: left">
        <span style="display: flex; align-items: center; gap: 14px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font: 500 18px Inter, sans-serif">Open on the stand</span><span style="font: 400 13px Inter, sans-serif; color: #CFC8B8">Continues at bar 58, page 4</span></span>
        </span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button style="height: 72px; padding: 0 20px; border: 1px solid #CFC8B8; border-radius: 14px; background: transparent; color: #1C1A16; display: flex; align-items: center; gap: 14px; text-align: left">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16M12 3v18"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font: 500 16px Inter, sans-serif">Split by instrument</span><span style="font: 400 12px Inter, sans-serif; color: #6B665C">One book per part</span></span>
      </button>
      <button style="height: 72px; padding: 0 20px; border: 1px solid #CFC8B8; border-radius: 14px; background: transparent; color: #1C1A16; display: flex; align-items: center; gap: 14px; text-align: left">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font: 500 16px Inter, sans-serif">Convert to Digital</span><span style="font: 400 12px Inter, sans-serif; color: #6B665C">About 9 minutes for 14 pages</span></span>
      </button>
      <button style="grid-column: span 2; height: 64px; padding: 0 20px; border: 1px solid #CFC8B8; border-radius: 14px; background: transparent; color: #1C1A16; display: flex; align-items: center; justify-content: space-between; text-align: left">
        <span style="display: flex; align-items: center; gap: 14px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6M15 18c0-2 1.3-4 3.5-4 1.4 0 2.5 1 2.5 3"/></svg>
          <span style="font: 500 16px Inter, sans-serif">Share with a group</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px">
          <span style="font: 500 13px Inter, sans-serif; padding: 6px 10px; border-radius: 8px; background: #F3EFE6; color: #1C1A16; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #5B86C8"></span>Quartet</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B665C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </span>
      </button>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; gap: 6px">
        <button style="height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #6B665C; font: 500 14px Inter, sans-serif">Export MusicXML</button>
        <button style="height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #6B665C; font: 500 14px Inter, sans-serif">Rename</button>
      </div>
      <button style="height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #B5392E; font: 500 14px Inter, sans-serif">Delete book…</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    // C minor: B♭ E♭ A♭ on a 12px staff, top line at y=18
    const FY = { B: 24, E: 6, A: 30 };
    const acc = ['B', 'E', 'A'].map((L, i) => ({ x: 64 + i * 14, y: 18 + FY[L] - 15 }));
    return { acc };
  }
}
</script>
</body>
</html>
